[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lending-policy-agent"
version = "0.1.0"
description = "Self-hosted lending policy boundary/cutoff extraction agent (Ollama + LangGraph + Chroma)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lending_agent.api" = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: needs a running Ollama, the real models and the sample handbook (run them with: pytest -m live)"]
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["src/lending_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
# Pyflakes (unused imports and names, undefined names) plus the pycodestyle errors that are real bugs.
select = ["E4", "E7", "E9", "F"]
