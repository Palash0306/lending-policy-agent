[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lending-policy-agent"
version = "0.1.0"
description = "Self-hosted lending policy boundary/cutoff extraction agent (Ollama + LangGraph + Chroma)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lending_agent.api" = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
